[workspace]
resolver = "2"
members = [
  "crates/nano-cli",
  "crates/nano-provider-xai",
  "crates/nano-runtime",
  "crates/nano-types",
]
exclude = ["tools/upstream-export"]

[workspace.package]
version = "0.6.3"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
nano-provider-xai = { version = "=0.6.3", path = "crates/nano-provider-xai" }
nano-runtime = { version = "=0.6.3", path = "crates/nano-runtime" }
nano-types = { version = "=0.6.3", path = "crates/nano-types" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustix = { version = "=1.1.4", features = ["fs", "time"] }
bytes = "=1.12.1"
futures-util = "=0.3.33"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
shlex = "=2.0.1"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
